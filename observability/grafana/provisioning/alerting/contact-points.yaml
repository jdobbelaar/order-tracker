apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-response
    receivers:
      - uid: incident-response-webhook
        type: webhook
        settings:
          # The incident-response service runs on the host (port 8001), not in Compose.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-response
    group_by: [alertname, http_route]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
